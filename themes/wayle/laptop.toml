[bar]
bg = "transparent"
background-opacity = 0

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "window-title",
    "media",
    "cpu",
    "ram",
]
center = [
    "weather",
    "clock",
    "updates",
    "systray",
    "notifications",
]
right = [
    "network",
    "bluetooth",
    "hyprsunset",
    "volume",
    "battery",
]

[styling]
theme-provider = "pywal"
matugen-contrast = 0.04938271604938271

[modules.hyprland-workspaces]
display-mode = "none"
app-icons-show = true
active-indicator = "underline"
border-show = true
border-color = "border-accent"

[modules.notification]
popup-duration = 3000

[wallpaper]
cycling-enabled = true
cycling-directory = "/home/tuples/Pictures/wallpapers/"
