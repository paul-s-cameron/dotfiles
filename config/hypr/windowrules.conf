###############
### WINDOWS ###
###############

# ----------------------------------------
# Ignore maximize requests
# ----------------------------------------
windowrule {
  name = suppress-maximize
  match:class = .*

  suppress_event = maximize
}

# ----------------------------------------
# Fix XWayland dragging issues
# (Removed invalid match fields)
# ----------------------------------------
windowrule {
  name = fix-xwayland-drag
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:fullscreen = 0

  no_focus = 1
}

# ----------------------------------------
# bg-float
# ----------------------------------------
windowrule {
  name = bg-float
  match:title = ^bg-float$

  float = 1
  border_size = 0
  no_shadow = 1
}

# ----------------------------------------
# bg-fetch
# ----------------------------------------
windowrule {
  name = bg-fetch
  match:title = ^bg-fetch$

  float = 1
  border_size = 0
  no_shadow = 1
  move = 6% 11%
  size = 27% 24%
}

# ----------------------------------------
# bg-cava
# ----------------------------------------
windowrule {
  name = bg-cava
  match:title = ^bg-cava$

  float = 1
  border_size = 0
  no_shadow = 1
  move = 100%-w-7% 11%
  size = 31% 27%
}

# ----------------------------------------
# bg-btop
# ----------------------------------------
windowrule {
  name = bg-btop
  match:title = ^bg-btop$

  float = 1
  border_size = 0
  no_shadow = 1
  move = 100%-w-2% 100%-h-2%
  size = 44% 50%
}

# ----------------------------------------
# bg-yazi
# ----------------------------------------
windowrule {
  name = bg-yazi
  match:title = ^bg-yazi$

  float = 1
  border_size = 0
  no_shadow = 1
  move = 3% 100%-h-3%
  size = 40% 46%
}

# ----------------------------------------
# feh
# ----------------------------------------
windowrule {
  name = feh-center
  match:class = ^feh$

  float = 1
  center = 1
}

